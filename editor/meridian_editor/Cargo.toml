[package]
name = "meridian-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "meridian"
path = "src/main.rs"

[dependencies]
meridian-asset-tools = { path = "../meridian_asset_tools" }
meridian-alluvium = { path = "../../engine/meridian_alluvium" }
meridian-assets = { path = "../../engine/meridian_assets" }
meridian-benchmark = { path = "../meridian_benchmark" }
meridian-build = { path = "../meridian_build" }
meridian-core = { path = "../../engine/meridian_core" }
meridian-diagnostics = { path = "../../engine/meridian_diagnostics" }
meridian-input = { path = "../../engine/meridian_input" }
meridian-modeler = { path = "../../engine/meridian_modeler" }
meridian-package = { path = "../../engine/meridian_package" }
meridian-platform = { path = "../../engine/meridian_platform", features = ["accessibility"] }
meridian-renderer = { path = "../../engine/meridian_renderer", features = ["ui-direct", "ui-raster-bridge"] }
meridian-rhi = { path = "../../engine/meridian_rhi" }
meridian-rt = { path = "../../engine/meridian_rt" }
meridian-save = { path = "../../engine/meridian_save" }
meridian-streaming = { path = "../../engine/meridian_streaming" }
meridian-tasks = { path = "../../engine/meridian_tasks" }
meridian-ui = { path = "../../engine/meridian_ui" }
meridian-world = { path = "../../engine/meridian_world" }
meridian-world-tools = { path = "../meridian_world_tools" }
meridian-editor-core = { path = "../meridian_editor_core" }
meridian-ui-editor = { path = "../meridian_ui_editor" }
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true

[lints]
workspace = true
